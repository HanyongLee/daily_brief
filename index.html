<!doctype html>
<!--
  공판 데일리 브리프 — 공개 틀 페이지(GitHub Pages용, 2026-11-14)
  구글 웹앱 화면을 이 페이지 안에 화면 가득 띄운다. 다른 사이트 틀 안에서는 구글 안내 띠가 나오지 않는다.
  웹앱은 ?embed=1 로 열 때만 틀을 허용한다(apps-script/v2/web_Code.gs). 이 파일에는 인증키·개인정보를 넣지 않는다.
  넘기는 주소 값: d=YYYY-MM-DD(지난 브리프 보기)만.
  공개 저장소에는 index.html·og-v2.png(링크 미리보기 이미지)·favicon-nh-v1.ico(탭 아이콘)만 올린다(옛 og.png는 이미 보낸 미리보기라 남겨 둠).
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>공판 데일리 브리프</title>
<!-- 링크 미리보기(카카오톡·메신저, 2026-11-14 → 2026-11-16 2판): 대표 이미지 og-v2.png(scripts/make_og.mjs로 만듦)와 설명 한 줄. 이미지 주소는 절대 주소여야 한다.
     7시 30분 = 임직원 안내 시각(오늘 브리프는 07:08~07:14에 들어옴). 주간(월)·월간(2일)은 07:30에 작업을 시작해 요일만 적는다 -->
<meta name="description" content="매일 아침 7시 30분, 공판사업 뉴스·실적과 주간·월간 흐름">
<meta property="og:type" content="website">
<meta property="og:locale" content="ko_KR">
<meta property="og:site_name" content="공판 데일리 브리프">
<meta property="og:title" content="공판 데일리 브리프">
<meta property="og:description" content="매일 아침 7시 30분, 공판사업 뉴스·실적과 주간·월간 흐름">
<meta property="og:url" content="https://hanyonglee.github.io/daily_brief/">
<meta property="og:image" content="https://hanyonglee.github.io/daily_brief/og-v2.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="공판 데일리 브리프 — 오늘 브리프 매일 아침 7시 30분, 주간 브리프 매주 월요일, 월간 브리프 매월 2일">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon-nh-v1.ico">
<style>
  :root{--bg:#f3f5f8;--ink:#2b3440;--sub:#5c6a78;--link:#005eb8}
  @media (prefers-color-scheme: dark){:root{--bg:#14181d;--ink:#e6e9ee;--sub:#a3adb8;--link:#7ab8ff}}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif}
  /* 불러오는 동안만 보이는 안내(틀이 그려지면 가려진다) */
  #wait{position:fixed;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
  #wait p{margin:0}
  #wait small{display:block;margin-top:6px;color:var(--sub)}
  #wait a{color:var(--link)}
  #app{position:fixed;top:0;right:0;bottom:0;left:0;width:100%;height:100%;border:0;display:block;background:transparent}
</style>
</head>
<body>
<div id="wait"><p>공판 데일리 브리프를 불러오는 중입니다.<small>화면이 열리지 않으면 <a id="direct" href="https://script.google.com/macros/s/AKfycbyx9RljH0gXKMzG7igH_j0bZRQKnLdyWuKmCDbo0Riyq_7eqqs9CihW-cgVTGPijd41/exec">구글 주소로 바로 열기</a></small></p></div>
<iframe id="app" title="공판 데일리 브리프" allow="clipboard-write"></iframe>
<script>
(function () {
  var EXEC = "https://script.google.com/macros/s/AKfycbyx9RljH0gXKMzG7igH_j0bZRQKnLdyWuKmCDbo0Riyq_7eqqs9CihW-cgVTGPijd41/exec";
  var m = /[?&]d=(\d{4}-\d{2}-\d{2})(?:&|$)/.exec(location.search), d = m ? m[1] : "";
  document.getElementById("app").src = EXEC + "?" + (d ? "d=" + d + "&" : "") + "embed=1";
  document.getElementById("direct").href = EXEC + (d ? "?d=" + d : "");
})();
</script>
</body>
</html>
